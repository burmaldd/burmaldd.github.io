<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>База адресов и платежей</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f2f5; }
        .box { background: white; max-width: 700px; margin: 0 auto; padding: 20px; border-radius: 15px; }
        input { padding: 10px; margin: 5px; border: 1px solid #ccc; border-radius: 8px; }
        button { padding: 10px 20px; background: #2563eb; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; }
        button:hover { background: #1d4ed8; }
        table { width: 100%; margin-top: 15px; border-collapse: collapse; }
        th { background: #1e2b3a; color: white; padding: 10px; text-align: left; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
        .del { color: red; cursor: pointer; font-weight: bold; margin-left: 10px; }
        .del:hover { color: darkred; }
        #search { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; }
        .btn-danger { background: #ef4444; margin-left: 10px; }
        .btn-danger:hover { background: #dc2626; }
    </style>
</head>
<body>

<div class="box">
    <h1>📋 База адресов и платежей</h1>
    
    <div>
        <input id="address" placeholder="Адрес" style="width: 200px;">
        <input id="amount" placeholder="Сумма (руб)" style="width: 150px;">
        <button onclick="addItem()">➕ Добавить</button>
        <button onclick="clearAll()" class="btn-danger">🗑 Удалить всё</button>
    </div>
    
    <input id="search" placeholder="🔍 Поиск..." onkeyup="showTable()">
    
    <div id="list"></div>
    <p id="count">Записей: 0</p>
</div>

<script>
let data = JSON.parse(localStorage.getItem('myData')) || [];

function saveData() {
    localStorage.setItem('myData', JSON.stringify(data));
}

// ДОБАВИТЬ
function addItem() {
    let address = document.getElementById('address').value;
    let amount = document.getElementById('amount').value;
    
    if (address === '' || amount === '') {
        alert('Заполни оба поля!');
        return;
    }
    
    data.push({
        id: Date.now(),
        address: address,
        amount: amount
    });
    
    document.getElementById('address').value = '';
    document.getElementById('amount').value = '';
    
    saveData();
    showTable();
}

// УДАЛИТЬ ОДНУ
function deleteItem(id) {
    if (confirm('Удалить запись?')) {
        let newData = [];
        for (let i = 0; i < data.length; i++) {
            if (data[i].id !== id) {
                newData.push(data[i]);
            }
        }
        data = newData;
        saveData();
        showTable();
    }
}

// УДАЛИТЬ ВСЁ
function clearAll() {
    if (confirm('Удалить ВСЕ записи?')) {
        data = [];
        saveData();
        showTable();
    }
}

// ПОКАЗАТЬ
function showTable() {
    let search = document.getElementById('search').value.toLowerCase();
    let list = document.getElementById('list');
    
    let filtered = [];
    for (let i = 0; i < data.length; i++) {
        let address = data[i].address.toLowerCase();
        let amount = data[i].amount;
        if (address.includes(search) || amount.includes(search)) {
            filtered.push(data[i]);
        }
    }
    
    if (filtered.length === 0) {
        list.innerHTML = '<p style="color:#94a3b8; text-align:center; padding:20px;">📭 Нет записей</p>';
        document.getElementById('count').textContent = 'Записей: 0';
        return;
    }
    
    let html = '<table>';
    html += '<tr><th>Адрес</th><th>Сумма (руб)</th><th>Действие</th></tr>';
    
    for (let i = 0; i < filtered.length; i++) {
        html += '<tr>';
        html += '<td>' + filtered[i].address + '</td>';
        html += '<td>' + filtered[i].amount + ' ₽</td>';
        html += '<td><span class="del" onclick="deleteItem(' + filtered[i].id + ')">✕ Удалить</span></td>';
        html += '</tr>';
    }
    html += '</table>';
    
    list.innerHTML = html;
    document.getElementById('count').textContent = 'Записей: ' + filtered.length;
}

showTable();
</script>

</body>
</html>
